<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | MUSE</title>
    <link rel="icon" type="image/png" href="images/muse logo (8).png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="javaScript/cart.js"></script>
</head>

<body>

    <header>
        <div class="site-logo" style="cursor: pointer;" onclick="window.location.href='index.html'">
            <img 
                src="images/muse logo1 (8).png"
                alt="MUSE Logo"
                class="site-logo"
            >
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shopTech.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <!--<li><a href="contact.html">Contact</a></li>-->
                <li>
                    <a href="cart.html" class="cart-link">
                        <span>View Cart</span>
                        <span id="cart-count-badge" class="cart-badge" style="display: none;">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <section class="section container my-5">
        <h2 class="text-center mb-4">Shopping Cart</h2>

        <div id="cart-items-container">
            <!-- Cart items will be dynamically inserted here -->
        </div>

        <div id="empty-cart-message" class="text-center py-5" style="display: none;">
            <p class="text-muted mb-4">Your cart is empty.</p>
            <a href="shopTech.html" class="btn btn-primary">Continue Shopping</a>
        </div>

        <div id="cart-summary" class="mt-4" style="display: none;">
            <div class="row">
                <div class="col-md-6 offset-md-6">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Order Summary</h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <span id="cart-subtotal">$0.00</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <strong>Total:</strong>
                                <strong id="cart-total">$0.00</strong>
                            </div>
                            <a href="https://wa.me/263788510037 " target="_blank" rel="noopener noreferrer"  id="checkout-btn" class="btn btn-primary w-100">
                                Checkout via WhatsApp
                            </a>
                            <a href="shopTech.html" class="btn btn-outline-secondary w-100 mt-2">
                                Continue Shopping
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 MUSE. Built for quality.</p>
    </footer>

    <script>
        // Display cart items
        function displayCart() {
            const cart = getCart();
            const cartItemsContainer = document.getElementById('cart-items-container');
            const emptyCartMessage = document.getElementById('empty-cart-message');
            const cartSummary = document.getElementById('cart-summary');
            
            const cartItems = Object.values(cart);
            
            if (cartItems.length === 0) {
                cartItemsContainer.innerHTML = '';
                emptyCartMessage.style.display = 'block';
                cartSummary.style.display = 'none';
                return;
            }
            
            emptyCartMessage.style.display = 'none';
            cartSummary.style.display = 'block';
            
            cartItemsContainer.innerHTML = cartItems.map(item => `
                <div class="card mb-3 border-0 shadow-sm">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-12 col-md-3 mb-3 mb-md-0">
                                <img src="${item.image || 'images/placeholder.jpg'}" 
                                     alt="${item.name}" 
                                     class="img-fluid rounded"
                                     style="max-height: 150px; object-fit: cover; width: 100%;">
                            </div>
                            <div class="col-12 col-md-5">
                                <h5 class="card-title mb-2">${item.name}</h5>
                                <p class="text-muted mb-0">$${item.price.toFixed(2)} each</p>
                            </div>
                            <div class="col-12 col-md-2 mb-3 mb-md-0">
                                <div class="input-group">
                                    <button class="btn btn-outline-secondary" 
                                            type="button" 
                                            onclick="updateCartQuantity('${item.id}', ${item.quantity - 1})">-</button>
                                    <input type="number" 
                                           class="form-control text-center" 
                                           value="${item.quantity}" 
                                           min="1"
                                           onchange="updateCartQuantity('${item.id}', this.value)">
                                    <button class="btn btn-outline-secondary" 
                                            type="button" 
                                            onclick="updateCartQuantity('${item.id}', ${item.quantity + 1})">+</button>
                                </div>
                            </div>
                            <div class="col-12 col-md-2 text-md-end">
                                <p class="fw-bold mb-2">$${(item.price * item.quantity).toFixed(2)}</p>
                                <button class="btn btn-sm btn-outline-danger" 
                                        onclick="removeFromCart('${item.id}')">
                                    Remove
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            updateCartTotal();
        }
        
        // Update cart total
        function updateCartTotal() {
            const total = getCartTotal();
            document.getElementById('cart-subtotal').textContent = `$${total.toFixed(2)}`;
            document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
            
            // Update WhatsApp checkout link with cart items
            const cart = getCart();
            const cartItems = Object.values(cart);
            const itemsText = cartItems.map(item => 
                `${item.name} (x${item.quantity}) - $${(item.price * item.quantity).toFixed(2)}`
            ).join('%0A');
            const totalText = `Total: $${total.toFixed(2)}`;
            const message = `Hi MUSE, I'd like to order:%0A%0A${itemsText}%0A%0A${totalText}`;
            
            document.getElementById('checkout-btn').href = `https://wa.me/263788510037?text=${message}`;
        }
        
        // Initialize cart display
        displayCart();
        updateCartCount();
    </script>

</body>

</html>
