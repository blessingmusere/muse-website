<!--nav button controls-->
<script>
    document.addEventListener("DOMContentLoaded", () => {
      // Toggle open/close when burger is clicked (explicit, reliable)
      document.querySelectorAll(".popup .burger").forEach((burger) => {
        burger.addEventListener("click", (e) => {
          e.preventDefault();   // prevent label default toggle (we handle it)
          e.stopPropagation();  // prevent document click from firing
    
          const popup = burger.closest(".popup");
          const checkbox = popup?.querySelector('input[type="checkbox"]');
          if (!checkbox) return;
    
          checkbox.checked = !checkbox.checked;
        });
      });
    
      // Click inside menu should NOT close it automatically
      document.querySelectorAll(".popup .popup-window").forEach((menu) => {
        menu.addEventListener("click", (e) => e.stopPropagation());
      });
    
      // Click anywhere else closes any open popup
      document.addEventListener("click", (e) => {
        document.querySelectorAll('.popup input[type="checkbox"]').forEach((cb) => {
          if (!cb.checked) return;
    
          const popup = cb.closest(".popup");
          if (!popup) return;
    
          // If click is outside the whole popup block, close
          if (!popup.contains(e.target)) {
            cb.checked = false;
          }
        });
      });
    
      // Optional: ESC closes
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          document.querySelectorAll('.popup input[type="checkbox"]').forEach(cb => cb.checked = false);
        }
      });
    });
    </script>
    <script>
        function setCartCount(count) {
          const badge = document.getElementById("cart-count-badge");
          if (!badge) return;
        
          const n = Math.max(0, parseInt(count, 10) || 0);
        
          badge.textContent = n;
        
          if (n > 0) badge.classList.add("show");
          else badge.classList.remove("show");
        }
        
        // Example:
        // setCartCount(3);
        // setCartCount(0);
    </script>
