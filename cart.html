<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | MUSE</title>
    <link rel="icon" type="image/png" href="images/muse logo (8).png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="javaScript/cart.js"></script>
</head>

<body>

    <header>
        <div class="site-logo" style="cursor: pointer;" onclick="window.location.href='index.html'">
            <img 
                src="images/muse logo1 (8).png"
                alt="MUSE Logo"
                class="site-logo"
            >
        </div>
        <nav>

            <!--Menu Button-->
            <label class="popup">
                <input type="checkbox">
            
                <div class="burger" tabindex="0">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            
                <nav class="popup-window">
                    <ul>
                        
                        <li><a href="shopTech.html">Tech Shop</a></li>
                        <li><a href="shopClothing.html">Clothing Shop</a></li>
                        <li><a href="about.html">About</a></li>
                    </ul>
                </nav>
            </label>
            
            <!-- Cart -->
            <div class="nav-icons">
                <a href="cart.html" class="cart-btn" aria-label="View cart">
                  
                  <!-- Cart icon -->
                  <svg xmlns="http://www.w3.org/2000/svg"
                       viewBox="0 0 24 24"
                       width="16" height="16"
                       fill="none"
                       stroke="currentColor"
                       stroke-width="2"
                       stroke-linecap="round"
                       stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                  </svg>
              
                  <!-- Cart count badge -->
                  <span id="cart-count-badge" class="cart-badge" aria-hidden="true">0</span>
                </a>
              </div>
        </nav>

    </header>

    <section class="section container my-5">
        <h2 class="text-center mb-4">Shopping Cart</h2>

        <div id="cart-items-container"  >
            <!-- Cart items will be dynamically inserted here -->
        </div>

        <div id="empty-cart-message" class="text-center py-5" style="display: none;">
            <p class="text-muted mb-4">Your cart is empty.</p>
            <a href="shopTech.html" class="btn btn-primary">Continue Shopping</a>
        </div>

        <div id="cart-summary" class="mt-4" style="display: none;">
            <div class="row">
                <div class="col-md-6 offset-md-6">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-text mb-3">Order Summary</h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="card-text">Subtotal:</span>
                                <span id="cart-subtotal" class="card-text">$0.00</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <strong class="card-text">Total:</strong>
                                <strong id="cart-total" class="card-text">$0.00</strong>
                            </div>
                            <a href="https://wa.me/263788510037 " target="_blank" rel="noopener noreferrer"  id="checkout-btn" class="btn btn-primary w-100">
                                Checkout via WhatsApp
                            </a>
                            <a href="shopTech.html" class="btn btn-outline-secondary w-100 mt-2">
                                Continue Shopping
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 MUSE. Built for quality.</p>
    </footer>

    <script>
        // Display cart items (make it globally accessible)
        window.displayCart = function() {
            const cart = getCart();
            const cartItemsContainer = document.getElementById('cart-items-container');
            const emptyCartMessage = document.getElementById('empty-cart-message');
            const cartSummary = document.getElementById('cart-summary');
            
            const cartItems = Object.values(cart);
            
            if (cartItems.length === 0) {
                cartItemsContainer.innerHTML = '';
                emptyCartMessage.style.display = 'block';
                cartSummary.style.display = 'none';
                return;
            }
            
            emptyCartMessage.style.display = 'none';
            cartSummary.style.display = 'block';
            
            cartItemsContainer.innerHTML = cartItems.map(item => {
                // Ensure price and quantity are numbers
                const price = parseFloat(item.price) || 0;
                const quantity = parseInt(item.quantity) || 1;
                const itemTotal = price * quantity;
                
                return `
                <div class="card mb-3 border-0 shadow-sm">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-12 col-md-3 mb-3 mb-md-0">
                                <img src="${item.image || 'images/placeholder.jpg'}" 
                                     alt="${item.name}" 
                                     class="img-fluid rounded"
                                     style="max-height: 150px; object-fit: cover; width: 100%;">
                            </div>
                            <div class="col-12 col-md-5">
                                <h5 class="card-text mb-2">${item.name}</h5>
                                <p class="card-text mb-0">$${price.toFixed(2)} each</p>
                            </div>
                            <div class="col-12 col-md-2 mb-3 mb-md-0">
                                <label class="card-text mb-1 d-block">Quantity</label>
                                <div class="input-group">
                                    <button class="btn btn-outline-secondary" 
                                            type="button" 
                                            onclick="updateCartQuantity('${item.id}', ${quantity - 1})">-</button>
                                    <input type="number" 
                                           id="qty-input-${item.id}"
                                           class="form-control text-center qty" 
                                           value="${quantity}" 
                                           min="1"
                                           style="width: 80px;"
                                           onchange="updateCartQuantity('${item.id}', this.value)">
                                    <button class="btn btn-outline-secondary" 
                                            type="button" 
                                            onclick="updateCartQuantity('${item.id}', ${quantity + 1})">+</button>
                                </div>
                            </div>
                            <div class="col-12 col-md-2 text-md-end">
                                <p class="card-text mb-2">$${itemTotal.toFixed(2)}</p>
                                <button class="btn btn-sm btn-outline-danger" 
                                        onclick="removeFromCart('${item.id}')">
                                    Remove
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
            
            updateCartTotal();
        }
        
        // Update cart total (make it globally accessible)
        window.updateCartTotal = function() {
            const cart = getCart();
            const cartItems = Object.values(cart);
            const total = getCartTotal();
            
            // Debug: log cart contents
            console.log('Cart items:', cartItems);
            console.log('Cart total:', total);
            
            const subtotalEl = document.getElementById('cart-subtotal');
            const totalEl = document.getElementById('cart-total');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            if (subtotalEl) {
                subtotalEl.textContent = `$${total.toFixed(2)}`;
            }
            if (totalEl) {
                totalEl.textContent = `$${total.toFixed(2)}`;
            }
            
            // Update WhatsApp checkout link with cart items
            if (checkoutBtn) {
                const cart = getCart();
                const cartItems = Object.values(cart);
                const itemsText = cartItems.map(item => 
                    `${item.name} (x${item.quantity}) - $${(item.price * item.quantity).toFixed(2)}`
                ).join('%0A');
                const totalText = `Total: $${total.toFixed(2)}`;
                const message = `Hi MUSE, I'd like to order:%0A%0A${itemsText}%0A%0A${totalText}`;
                
                checkoutBtn.href = `https://wa.me/263788510037?text=${message}`;
            }
        }
        
        // Reset cart when Checkout via WhatsApp is clicked
        function initCheckoutReset() {
            const checkoutBtn = document.getElementById('checkout-btn');
            if (checkoutBtn) {
                checkoutBtn.addEventListener('click', function() {
                    clearCart();
                    displayCart();
                });
            }
        }
        
        // Initialize cart display when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                displayCart();
                updateCartCount();
                initCheckoutReset();
            });
        } else {
            displayCart();
            updateCartCount();
            initCheckoutReset();
        }
    </script>

</body>

</html>
